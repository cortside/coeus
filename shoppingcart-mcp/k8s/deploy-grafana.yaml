apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: mcp
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: admin
        volumeMounts:
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
        - name: provisioning-ds
          mountPath: /etc/grafana/provisioning/datasources
        - name: provisioning-dash
          mountPath: /etc/grafana/provisioning/dashboards
      volumes:
      - name: dashboards
        configMap:
          name: grafana-dashboards
      - name: provisioning-ds
        configMap:
          name: grafana-datasources
      - name: provisioning-dash
        configMap:
          name: grafana-datasources
