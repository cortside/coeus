apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-backend
  template:
    metadata:
      labels:
        app: agent-backend
    spec:
      containers:
      - name: agent-backend
        image: agent-backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: agent-backend-config
