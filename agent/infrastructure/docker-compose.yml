version: '3.8'
services:
  agent-backend:
    build: ../agent-backend
    env_file:
      - ../agent-backend/.env.example
    ports:
      - "8000:8000"
    depends_on:
      - prometheus
  chat-frontend:
    build: ../chat-frontend
    env_file:
      - ../chat-frontend/.env.example
    ports:
      - "3000:80"
    depends_on:
      - agent-backend
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    volumes:
      - ./grafana-dashboard.json:/etc/grafana/provisioning/dashboards/chat-dashboard.json
